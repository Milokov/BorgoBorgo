<ion-header>
  <ion-toolbar color="dark">
    <ion-title class="ion-text-center">🍔 Menú Borgo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="menu-header ion-text-center">
    <h2>Nuestros Productos</h2>
    <p>Menú sencillo e interactivo</p>
  </div>

  <ion-list lines="inset" class="menu-list">
    <ion-item *ngFor="let item of menu" class="menu-item">
      <span slot="start" class="emoji">{{ item.emoji }}</span>
      <ion-label>
        <h2>{{ item.name }}</h2>
        <p class="price">{{ formatPrice(item.price) }}</p>
      </ion-label>
      <div slot="end" class="controls">
        <ion-button size="small" fill="outline" color="danger" (click)="removeItem(item)" [disabled]="item.count === 0">-</ion-button>
        <span class="count">{{ item.count }}</span>
        <ion-button size="small" fill="solid" color="danger" (click)="addItem(item)">+</ion-button>
      </div>
    </ion-item>
  </ion-list>

  <ion-card *ngIf="getTotalItems() > 0" class="summary-card">
    <ion-card-content class="ion-text-center">
      <h3>Resumen del Pedido</h3>
      <p>Items seleccionados: <strong>{{ getTotalItems() }}</strong></p>
      <p class="total">Total: <strong>{{ formatPrice(getTotalPrice()) }}</strong></p>
    </ion-card-content>
  </ion-card>
</ion-content>
